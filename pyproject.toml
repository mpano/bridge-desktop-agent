[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-agent"
version = "0.1.0"
description = "A policy-controlled local macOS assistant"
requires-python = ">=3.12"
dependencies = ["openai>=2,<3", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "structlog>=25,<26", "httpx>=0.28,<1"]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
menubar = ["rumps>=0.4,<0.5; sys_platform == 'darwin'"]
voice = ["numpy>=2,<3", "sounddevice>=0.5,<1", "faster-whisper>=1.1,<2", "openwakeword>=0.6,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
desktop-agent = "app.main:main"
bridge = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.ui" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
