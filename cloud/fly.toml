# Bridge Cloud on Fly.io. One machine (the credit ledger is SQLite on a volume).
# Change `app` if the name is taken, and PUBLIC_URL to match.
app = "bridge-cloud"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/cloud.db"
  PUBLIC_URL = "https://bridge-cloud.fly.dev"

[[mounts]]
  source = "bridge_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
