<!doctype html>
<html lang="en">
<head>

  <meta name="color-scheme" content="light dark">
  <title>Bridge</title>
  <link rel="stylesheet" href="/ui/style.css">
  <link rel="stylesheet" href="/ui/mini.css">
  <script src="/ui/dom.js" defer></script>
  <script src="/ui/mini.js" defer></script>
  <script src="/ui/avatar.js" defer></script>

<body class="buddy-page">

    <div id="bd-menu" class="bd-menu" role="menu" hidden></div>

      <span id="bd-chip" class="bd-chip" hidden></span>
      <button type="button" id="bd-face" class="bd-face" aria-label="Talk to Bridge">

        <span id="bd-badge" class="bd-badge" hidden></span>
      </button>
    </div>
  </div>
